# 把 docs/ 的 VitePress 站点发布到 GitHub Pages
#
# 站点地址：https://violateer.github.io/doc-template/
#
# 两个要点：
#   1. 这是**项目站点**，挂在 /doc-template/ 下，构建时必须传 DOCS_BASE=/doc-template/，
#      否则 index.html 里的 /assets/... 会指向根路径，整站白屏。
#   2. 改完文档直接推 main，workflow 会自动构建部署，不需要额外的发布步骤。
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 同时只允许一个部署在跑；排队等前一个结束，不取消正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: 安装依赖并构建
        working-directory: docs
        env:
          DOCS_BASE: /doc-template/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        with:
          # 首次运行自动把仓库的 Pages 源切成 GitHub Actions，省掉手动去设置页点一遍
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
