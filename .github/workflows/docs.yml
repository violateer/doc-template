# 把 docs/ 的 VitePress 站点发布到 GitHub Pages
#
# 站点地址：https://violateer.github.io/doc-template/
#
# 三个要点：
#   1. 这是**项目站点**，挂在 /doc-template/ 下，构建时必须传 DOCS_BASE=/doc-template/，
#      否则 index.html 里的 /assets/... 会指向根路径，整站白屏。
#   2. 改完文档直接推 main，workflow 会自动构建部署，不需要额外的发布步骤。
#   3. 前置条件：仓库 Settings → Pages → Source 必须选 "GitHub Actions"。
#      这一步只能手动做（或用带 admin 权限的 PAT），工作流自己启用不了。
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 同时只允许一个部署在跑；排队等前一个结束，不取消正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: 安装依赖并构建
        working-directory: docs
        env:
          DOCS_BASE: /doc-template/
        run: |
          npm ci
          npm run build

      # 不要加 enablement: true —— 它要求一个非 GITHUB_TOKEN 的令牌（PAT 或 App），
      # 用默认令牌会直接报 Resource not accessible by integration。
      # Pages 的源需要在仓库 Settings → Pages 里手动选一次 "GitHub Actions"。
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
