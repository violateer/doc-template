# ============================================================================
# doc-template-example 的运行编排（示例宿主，不是发布物）。
#
# 真实地址与凭据不写在这里，也不放 .env 文件：由调用方（Jenkins 任务的
# environment 块）把 DOC_* 注入环境变量，compose 直接读环境。
#
#   DOC_DB_URL=... DOC_S3_ENDPOINT=... docker compose -f deploy/docker-compose.yml up -d
#
# 缺变量时会带着下面 :? 后面的提示直接报错，不会带着空连接串起来。
# ============================================================================
services:
  doc-template-example:
    image: "${IMAGE_NAME:-doc-template-example}:${IMAGE_TAG:-latest}"
    container_name: "${CONTAINER_NAME:-doc-template-example}"
    restart: unless-stopped
    # 让容器里能解析 host.docker.internal：演示模板的 API 数据块要回调宿主机的 9150 端口。
    # Docker Desktop（Win/Mac）本来就有这条，Linux 上必须显式加，host-gateway 指向宿主机网关。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-9150}:9150"
    environment:
      # dev 档位从环境变量读连接信息（application-dev.yml，进 git）；
      # local 档位是个人文件，不进 git，容器里根本没有，所以部署统一用 dev。
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      TZ: Asia/Shanghai

      DOC_DB_URL: "${DOC_DB_URL:?DOC_DB_URL 未设置（由 Jenkins 任务的 environment 注入）}"
      DOC_DB_USERNAME: "${DOC_DB_USERNAME:?DOC_DB_USERNAME 未设置}"
      DOC_DB_PASSWORD: "${DOC_DB_PASSWORD:?DOC_DB_PASSWORD 未设置}"

      DOC_S3_ENDPOINT: "${DOC_S3_ENDPOINT:?DOC_S3_ENDPOINT 未设置}"
      DOC_S3_REGION: "${DOC_S3_REGION:-us-east-1}"
      DOC_S3_BUCKET: "${DOC_S3_BUCKET:-doc-template}"
      DOC_S3_ACCESS_KEY: "${DOC_S3_ACCESS_KEY:?DOC_S3_ACCESS_KEY 未设置}"
      DOC_S3_SECRET_KEY: "${DOC_S3_SECRET_KEY:?DOC_S3_SECRET_KEY 未设置}"
    volumes:
      # 用命名卷而不是 ./data：Jenkins 常常跑在容器里、只挂了 docker.sock，
      # 那时 bind mount 的相对路径会被按「宿主机」解析，数据落到意想不到的地方。
      - doc-template-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9150/doc-template/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  doc-template-data:
