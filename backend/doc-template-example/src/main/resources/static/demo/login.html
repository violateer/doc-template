<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例登录 · Vio Doc Template</title>
  <style>
    /* 企业简洁：浅石板底、白卡片配发丝边框、单一企业蓝。动效 160ms ease-out。 */
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e5e7eb;
      --divider: #eef2f6;
      --text: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --primary-tint: #eff6ff;
      --action: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #dc2626;
      --radius-card: 12px;
      --radius-control: 8px;
      --shadow-rest: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-hover: 0 4px 12px rgba(15, 23, 42, 0.08);
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --dur: 160ms;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", "Noto Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 32px 32px 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-rest), 0 10px 28px -18px rgba(15, 23, 42, 0.14);
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .brand svg { width: 32px; height: 32px; flex: none; }
    .brand-name {
      font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
      color: var(--text-muted); text-transform: uppercase;
    }

    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
    .sub { margin: 0 0 20px; font-size: 13px; line-height: 1.65; color: var(--text-muted); }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-bottom: 20px; padding: 4px 10px;
      font-size: 12px; font-weight: 500; color: var(--primary);
      background: var(--primary-tint); border: 1px solid #dbeafe; border-radius: 999px;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
    .badge.is-none { color: #92400e; background: #fffbeb; border-color: #fde68a; }
    .badge.is-none .dot { background: var(--warning); }

    label { display: block; margin-bottom: 16px; font-size: 13px; font-weight: 500; color: var(--text-body); }
    input {
      display: block; width: 100%; margin-top: 6px; padding: 9px 12px;
      font-size: 14px; color: var(--text);
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-control);
      outline: none;
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.14); }

    button {
      width: 100%; margin-top: 8px; padding: 10px 14px;
      font-size: 14px; font-weight: 500; color: #fff; cursor: pointer;
      background: var(--primary);
      border: 0; border-radius: var(--radius-control);
      box-shadow: var(--shadow-rest);
      transition: background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
        transform var(--dur) var(--ease);
    }
    button:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .ghost {
      width: auto; margin: 0; padding: 0; color: var(--primary);
      background: none; border: 0; box-shadow: none; font-size: 13px; font-weight: 500;
    }
    .ghost:hover { text-decoration: underline; transform: none; box-shadow: none; background: none; }

    .error { min-height: 18px; margin: 10px 0 0; font-size: 13px; color: var(--danger); }

    .hint {
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider);
      font-size: 12px; line-height: 1.9; color: var(--text-muted);
    }
    .hint code {
      padding: 1px 5px; font-size: 12px; color: var(--primary);
      background: #f1f5f9; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .status { display: none; margin-bottom: 16px; padding: 10px 12px; font-size: 13px; border-radius: var(--radius-control); }
    .status.on { display: block; color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0; }
    .status b { font-weight: 600; }

    .link-row { margin-top: 16px; text-align: center; font-size: 13px; }
    .link-row a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .link-row a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:hover:not(:disabled), button:active:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="12" fill="#1e40af" />
        <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 14 12 23l20 9 20-9-20-9Z" />
          <path d="M12 33l20 9 20-9" />
          <path d="M12 43l20 9 20-9" />
        </g>
      </svg>
      <span class="brand-name">Vio Doc Template</span>
    </div>

    <h1>示例登录</h1>
    <p class="sub">example 模块自带的极简登录，用来演示 <code>doc-template.auth.mode=custom</code>。</p>

    <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">认证模式：检测中</span></div>

    <div class="status" id="status"></div>

    <form id="form" novalidate>
      <label>用户名
        <input id="username" name="username" value="admin" autocomplete="username" />
      </label>
      <label>密码
        <input id="password" name="password" type="password" value="Admin@123" autocomplete="current-password" />
      </label>
      <button type="submit" id="submit">登录并进入</button>
      <p class="error" id="error"></p>
    </form>

    <div class="hint">
      演示账号：<code>admin / Admin@123</code> · <code>demo / Demo@123</code><br />
      切换模式：<code>--doc-template.auth.mode=custom</code> 启用认证，去掉则回到 <code>none</code>。
    </div>

    <div class="link-row"><a href="/doc-template/">直接进入模板管理 →</a></div>
  </div>

  <script>
    const TOKEN_KEY = 'token';
    const DEFAULT_REDIRECT = '/doc-template/';

    const params = new URLSearchParams(location.search);
    const redirectTo = safeRedirect(params.get('redirect'));
    const form = document.getElementById('form');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const submitEl = document.getElementById('submit');
    const errorEl = document.getElementById('error');
    const statusEl = document.getElementById('status');
    const badgeEl = document.getElementById('badge');
    const badgeTextEl = document.getElementById('badgeText');

    /** 只允许跳回本站路径，避免被 ?redirect=//evil.com 带走。 */
    function safeRedirect(raw) {
      if (!raw) return DEFAULT_REDIRECT;
      try {
        const url = new URL(raw, location.origin);
        if (url.origin !== location.origin) return DEFAULT_REDIRECT;
        return url.pathname + url.search + url.hash;
      } catch (e) {
        return DEFAULT_REDIRECT;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderMode(mode) {
      const isNone = mode === 'none';
      badgeEl.className = isNone ? 'badge is-none' : 'badge';
      badgeTextEl.textContent = '认证模式：' + (mode || '未知') + (isNone ? '（不校验登录态）' : '');
    }

    async function refresh() {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = token ? { Authorization: 'Bearer ' + token } : {};
      let data = {};
      try {
        const resp = await fetch('/demo/me', { headers });
        data = await resp.json();
      } catch (e) {
        badgeTextEl.textContent = '认证模式：读取失败';
        return;
      }
      renderMode(data.mode);
      if (data.authenticated) {
        statusEl.className = 'status on';
        statusEl.innerHTML =
          '当前已登录：<b>' + escapeHtml(data.username) + '</b> · ' +
          '<button type="button" class="ghost" id="logout">退出登录</button>';
        document.getElementById('logout').addEventListener('click', logout);
      } else {
        statusEl.className = 'status';
        statusEl.textContent = '';
        localStorage.removeItem(TOKEN_KEY);
      }
    }

    async function logout() {
      const token = localStorage.getItem(TOKEN_KEY);
      try {
        await fetch('/demo/logout', {
          method: 'POST',
          headers: token ? { Authorization: 'Bearer ' + token } : {}
        });
      } catch (e) {
        /* 忽略：本地清掉 token 就够了 */
      }
      localStorage.removeItem(TOKEN_KEY);
      errorEl.textContent = '';
      statusEl.className = 'status on';
      statusEl.textContent = '已退出登录';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      submitEl.disabled = true;
      try {
        const resp = await fetch('/demo/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameEl.value.trim(), password: passwordEl.value })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          errorEl.textContent = data.msg || ('登录失败（HTTP ' + resp.status + '）');
          return;
        }
        localStorage.setItem(TOKEN_KEY, data.tokenValue);
        location.href = redirectTo;
      } catch (e) {
        errorEl.textContent = '请求失败，请确认后端已启动';
      } finally {
        submitEl.disabled = false;
      }
    });

    refresh();
  </script>
</body>
</html>
