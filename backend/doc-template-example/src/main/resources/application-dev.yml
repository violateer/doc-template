# ============================================================================
# 团队/CI 用的调试 profile —— 连接真实数据库 + 真实对象存储，但地址与凭据全部走参数。
# 启动方式：
#   --spring.profiles.active=dev
#
# 说明：
#   1. 这个文件里**不写任何真实地址和凭据**，全部由环境变量（或 -D / 启动参数）提供，
#      可以直接提交进仓库、给团队和流水线共用。
#   2. 必须提供的环境变量（缺任何一个都会启动失败并提示 Could not resolve placeholder）：
#        DOC_DB_URL           JDBC 连接串，四种库的写法见下面 spring.datasource 的注释
#        DOC_DB_USERNAME      数据库用户名
#        DOC_DB_PASSWORD      数据库密码
#        DOC_S3_ENDPOINT      对象存储 API 地址，例如 http://127.0.0.1:9000
#        DOC_S3_ACCESS_KEY    对象存储访问密钥
#        DOC_S3_SECRET_KEY    对象存储私有密钥
#      可选：DOC_S3_REGION（默认 us-east-1）、DOC_S3_BUCKET（默认 doc-template）
#      可选：DOC_AI_ENABLED / DOC_AI_API_KEY / DOC_AI_BASE_URL / DOC_AI_MODEL，见下面 doc-template.ai
#   3. 想连自己的库又不想设环境变量，用 local profile（application-local.yml，
#      个人本地文件，不进 git）：--spring.profiles.active=local
#   4. 这里只配 spring.datasource（宿主数据源），doc-template.datasource 依然不配，
#      所以模板元数据表和业务表在同一个库，SQL 数据块写 primary 或留空即可。
#   5. 这个文件只属于 example 示例宿主，不会进入 starter 的 jar。
# ============================================================================
spring:
  datasource:
    # 驱动按 URL 自动推断，不用写 driver-class-name：同一个 profile 换库只改 DOC_DB_URL。
    # 五种库的连接串（把 DOC_DB_URL 设成其中一条即可）：
    #   MySQL 8      jdbc:mysql://127.0.0.1:3306/doc_template?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    #   MariaDB      jdbc:mariadb://127.0.0.1:3306/doc_template?useUnicode=true&characterEncoding=utf8
    #   PostgreSQL   jdbc:postgresql://127.0.0.1:5432/doc_template
    #   SQL Server   jdbc:sqlserver://127.0.0.1:1433;databaseName=doc_template;encrypt=false
    #   Oracle       jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1
    #
    # 不想用环境变量、想直接写死，就把下面三行替换成对应库的这一段（只留一段，其余注释掉）：
    #
    #   MySQL / MariaDB
    #   url: "jdbc:mysql://127.0.0.1:3306/doc_template?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
    #   username: root
    #   password: "123456"
    #
    #   PostgreSQL 12+
    #   url: jdbc:postgresql://127.0.0.1:5432/doc_template
    #   username: postgres
    #   password: postgres
    #
    #   SQL Server 2016+
    #   url: "jdbc:sqlserver://127.0.0.1:1433;databaseName=doc_template;encrypt=false"
    #   username: sa
    #   password: "YourStrong!Passw0rd"
    #
    #   Oracle 12c+（用户名就是建表所在的 schema）
    #   url: jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1
    #   username: doc_template
    #   password: doc_template
    #
    # 五种库的元数据表都由 Starter 自动创建（每种库一份建表脚本），前提是库已建好、
    # 账号有建表权限；换其他数据库时把 doc-template.initialize-schema 设成 false，自己执行 DDL。
    url: ${DOC_DB_URL}
    username: ${DOC_DB_USERNAME}
    password: ${DOC_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: host-pool

doc-template:
  # 元数据表建在宿主的库里（缺表会自动创建）
  initialize-schema: true
  # 认证：示例宿主自带极简登录（admin / Admin@123、demo / Demo@123），
  # 未登录打开 /doc-template/ 会跳到 /demo/login.html，登录后自动跳回；
  # /api/doc-template/** 未登录返回 401。改成 none 即关闭认证。
  auth:
    mode: custom

  # 文件存储：走真实的 MinIO/RustFS。
  # 不想用 S3 就把整段注释掉，会自动退回本地磁盘（base-path 目录）。
  storage:
    type: s3
    endpoint: ${DOC_S3_ENDPOINT}
    region: ${DOC_S3_REGION:us-east-1}
    bucket: ${DOC_S3_BUCKET:doc-template}
    access-key: ${DOC_S3_ACCESS_KEY}
    secret-key: ${DOC_S3_SECRET_KEY}
    path-style-access: true
    prefix: doc-template

  # AI 标注：让模型读文档结构快照、出标记计划，管理页「AI 导入」用它。
  # 开启意味着文档正文会被发到 base-url 指向的服务，对外系统请确认这条链路可接受。
  #   打开：DOC_AI_ENABLED=true + DOC_AI_API_KEY=<你的密钥>，两个都要给
  #   只给 key 不给 enabled 不生效；给了 enabled 却没给 key 会启动失败并指出缺哪一项
  #   base-url / model 有默认值（DeepSeek），换服务商只改这两个
  ai:
    enabled: ${DOC_AI_ENABLED:false}
    # 换成其他服务商只改 base-url 和 model 两行：任何 OpenAI Chat Completions 兼容接口都能用
    base-url: ${DOC_AI_BASE_URL:https://api.deepseek.com}
    api-key: ${DOC_AI_API_KEY:}
    model: ${DOC_AI_MODEL:deepseek-chat}
    # 生成结构化产物建议保持 0：同样的输入要得到同样的计划
    temperature: 0
    # 输出上限一次给足：推理模型的思考也计入这里，给小了正文还没开始就被截断。
    # 它只决定「模型能说多久」，不按用量计费 —— 想完会自己停，不会真的花满。
    # 服务商自己的上限更小时，会按它的报错自动降下来，不用手改。
    max-tokens: 32768
    # 推理模型的思考时间不可控，超时给足
    timeout-ms: 180000
    # 自检没过就把错误原文回灌给模型重来，含首次在内的总次数
    max-attempts: 3
    # 各服务商自己的开关，原样并入请求体。默认留空即可 —— 模块按协议通用处理，
    # 换模型不用改这里；只有需要厂商专有能力时才填，键名和取值以服务商文档为准，各家互不通用。
    extra-body: {}

# 演示站：dev 就是对外部署的那一套，内置示例模板只读（编码清单见 application.yml）
demo:
  readonly:
    enabled: true
